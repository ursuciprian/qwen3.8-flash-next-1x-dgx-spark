# Release: v2.1.0 (old name v3e)
# EXPERIMENTAL single-Spark (TP=1) recipe v3e (2026-10-08): v3d + the retrained MTP drafter.
#   - Model: ursuciprian/Qwen3.8-Flash-Next-NVFP4-GDN-MSE @ 16c9bd54 = 244cb6fe (v3d) with the 24 dense BF16 mtp.* tensors
#     of model-00034 retrained (#97 refit run 1): 72 steps of 8192 anchors (0.66 epoch) on ~3.5M tokens of v3d's own
#     outputs, KL to the served target's top-20 at 6 draft depths, fp8 drafter KV as served. Drafter experts and the
#     K131072 draft head stay at the served NVFP4 values. Every other file is byte-identical to 244cb6fe.
#   - Offline held-out acceptance per position, T=0: 0.878/0.750/0.635/0.534/0.449/0.377 -> 0.905/0.797/0.699/0.614/0.542/0.480.
#   - Screen vs v3d (k56 Thunderdome, one arm per Spark, 2 passes, T=0): acceptance pos 1-4
#     dgx-01 0.819/0.661/0.535/0.431 -> 0.856/0.713/0.593/0.489, dgx-02 0.818/0.666/0.539/0.438 -> 0.854/0.708/0.589/0.488;
#     fresh c4 +4.9% (noise 3.1%) / +7.9% (2.8%), fresh c8 +6.8% (3.6%) / +8.1% (2.6%), 16K c4 +5.5% (3.7%) / +5.7% (3.2%),
#     16K c8 wall +2.9% (1.0%) / +2.0% (1.0%), pp2048 c1 +0.0% (1.0%) / -0.9% (2.0%); no cell worse beyond noise.
#   - Gate (both Sparks): hardmode 91, TC-45 100, fidelity 20/20 at 8k-128k (one extra 128k seed on dgx-01 19/20),
#     stragglers c8-c16 0 preemptions. Jev ship 0.97.
#   - Image: the v3d HF image + the b12x plan seed re-keyed to the 16c9bd54 snapshot path (3205a613) and the torch AOT
#     compile cache of boots of this recipe. Nothing else changes.
#   Results: results/thunderdome-k56-20261007. Rollback: qwen3.8-flash-next-1x-dgx-spark-previous (v3d).
#
# Base: v3d header below.
# EXPERIMENTAL single-Spark (TP=1) recipe v3d (2026-10-05): v3c + NVFP4 GDN weights for decode, MXFP8 for prefill.
#   - Model: ursuciprian/Qwen3.8-Flash-Next-NVFP4-GDN-MSE = local-inference-lab/Qwen3.8-Flash-Next-NVFP4 @ 7c4f1bc1 with
#     the GDN in_proj_qkv / in_proj_z / out_proj weights of all 36 GDN layers requantized from the BF16 base to weight-only
#     NVFP4 (per-block MSE scale search); every other tensor is byte-identical. Qwen Community License 1.0.
#   - VLLM_B12X_NVFP4_MXFP8_MIN_TOKENS=41: those layers also hold the MXFP8 weights of the base checkpoint (shard 35 of
#     7c4f1bc1, fetched before the server starts when it is not in the HF cache) and serve calls of 41+ rows (prefill)
#     with them; decode steps (at most 8 x 5 = 40 rows) use NVFP4. +~1.1 GiB.
#   - Image: vLLM exp/v3d (= exp/v3c 50330171 + the GDN dispatch), b12x 21e0b201, plan seed + AOT compile cache.
#   - Screen vs v3c (boots v3c, v3d, v3d, v3c on one Spark, T=0): fresh c8 +4.4% (noise 1.9%), 16K c4 +5.9% (noise 3.0%),
#     counting c8 +7.8% (noise 2.1%), tg512 c1 50.0 -> 59.7 tok/s, pp2048 c1 -0.9% (noise 1.0%), other cells within noise,
#     acceptance per draft position within 0.005. A 128-row cutoff lost 2.3% on pp2048 (noise 1.0%) and was dropped.
#   - Gate: hardmode 91, TC-45 100, fidelity 20/20 at 8k-128k plus 128k seeds 11/13 20/20, stragglers c8-c16
#     0 preemptions, min MemAvailable 14.04 GiB.
#   - The b12x plan and the torch compile key include the model path, so the image seed is built from boots of this
#     recipe (HF snapshot 244cb6fe): plan f7894ea6 + AOT keys 237b44e9 / 30859ad7 / aff8b2f6. A boot of the published
#     image with those entries removed from the runtime cache loaded them from the image (171 s to healthy).
#   Results: results/tp1-v3d-20261005. Rollback: qwen3.8-flash-next-1x-dgx-spark-previous (v3c).
#
# Base: v3c header below.
# EXPERIMENTAL single-Spark (TP=1) recipe v3c (2026-10-05): v3b + two GPU memory cuts, spent on a larger KV pool.
#   - VLLM_GDN_SHARED_PREFILL_STAGING=1: one 257.5 MiB GDN prefill staging buffer for all 36 GDN layers instead of
#     one per layer (frees ~8.8 GiB).
#   - VLLM_GDN_COMPACT_RECORDS=1: MTP draft-step GDN records live in a 4.3 MiB per-layer side buffer, so a request
#     holds 1 mamba block per group (2 at a boundary step) instead of 5-6. Compact records change the compile key;
#     the image carries the matching torch AOT compile cache.
#   - KV pool 6 GiB -> 14 GiB: 993,754 tokens (v3b 379,362). Per 3,024 tokens a request takes one page in each of
#     13 attention groups, plus 37 GDN state pages. Requests that fit at once: ~40 at 16K, ~14 at 64K, ~7.5 at 128K (max_num_seqs 8).
#   - Image: vLLM exp/v3c 50330171 (= exp/r18-mem 3152b385, which contains exp/r13-ple-prefill, plus
#     exp/gdn-compact), b12x exp/gdn-compact 21e0b201, plan seed + AOT compile cache in /opt/b12x-seed.
#   - Screen vs v3b (boots v3b, v3c, v3c, v3b on one Spark, T=0): fresh c4 +2.45% (noise 1.57%), counting c8 +3.13% (noise 1.00%),
#     16K with 8 requests 347-370 s -> 125-126 s per run, every other cell within noise, acceptance per draft
#     position unchanged, T=0 output identity check passed. A 16 GiB pool lost 2.0% at 16K c4 (noise 1.5%).
#   - Gate: hardmode 93, TC-45 100, fidelity 20/20 at 8k-128k plus 128k seeds 11/13 20/20, stragglers c8-c16
#     0 preemptions, min MemAvailable 15.01 GiB.
#   Results: results/tp1-v3c-20261005. Rollback at the time: v3b (now archive/recipes/qwen3.8-flash-next/qwen3.8-flash-next-1x-dgx-spark-v3b-20261005.yaml).
#
# Base: v3b header below.
# EXPERIMENTAL single-Spark (TP=1) recipe v3b (2026-10-04): v3a + read-ahead for prefill-sized PLE gathers.
#   - VLLM_PLE_MMAP_PREFILL_WILLNEED=1: gathers larger than VLLM_PLE_MMAP_WILLNEED_MAX (prefill chunks)
#     get fadvise WILLNEED on their rows from a helper thread before the copy, so rows evicted from the
#     page cache no longer fault in one at a time. Host-side only, same numerics; not a compile factor,
#     so the v3a AOT and plan seed in the image stay valid.
#   - Image: v3a warm + vLLM exp/r13-ple-prefill 0632e506 (ple_mmap.py, envs.py), b12x 5bf24021.
#   - A/B vs v3a settings on the same image (6 fresh boots per arm over 2 Sparks, llama-benchy T=0,
#     3 runs per cell): pp2048 c1 +50.2%, c4 +19.3%, c8 +9.3%; 16k prefill c1 +4.6%; pp2048 c1 sd
#     32.0 -> 14.9 tok/s; no decode cell worse.
#   - Gate: hardmode 91, TC-45 100, fidelity 20/20 at 8k-128k plus 128k seeds 11/13 20/20,
#     stragglers c8-c16 0 preemptions, min MemAvailable 14.01 GiB.
#   Results: results/tp1-v3b-20261004. Rollback: qwen3.8-flash-next-1x-dgx-spark-previous (v3a).
#
# Base: v3a header below.
# EXPERIMENTAL single-Spark (TP=1) recipe v3a (2026-10-04): v2 + the PLE reader NVMe keepalive.
#   - VLLM_PLE_MMAP_KEEPALIVE_MS=50: one 4 KiB O_DIRECT read of the PLE table every 50 ms while
#     gathers are recent, so the NVMe drive does not drop into APST (100 ms idle timeout, ~10 ms
#     exit) between decode steps. Host-side only, same numerics.
#   - Image: vLLM exp/v3-tp1 7fa812b3, b12x 5bf24021, TP=1 plan seed as v2, plus the torch AOT
#     compile cache of a cold boot in /opt/b12x-seed/torch_compile_cache (copied into the runtime
#     cache when absent, so the first boot on a new Spark skips the compile).
#   - Paired A/B vs v2 (ABBA, 4 passes over 2 Sparks, temperature 0), decode step time:
#     c4 -8.4%, c8 -5.1%, 16k c4 -8.0%; c1/c2 -0.5..-0.9%; acceptance per position unchanged.
#   - Gate: hardmode 92, TC-45 100, fidelity 20/20 at 8k-128k plus 128k seeds 11/13 20/20,
#     stragglers c8-c16 0 preemptions, min MemAvailable 13.97 GiB.
#   Results: results/tp1-v3a-20261004. Rollback: qwen3.8-flash-next-1x-dgx-spark-previous (v2).
#
# Base: v2 header below.
# EXPERIMENTAL single-Spark (TP=1) recipe, v2 (2026-10-02, opus-kernel-17). One GB10, no CX-7.
#
# Fit: the checkpoint is 98.5 GiB, 26.8 GiB of it the PLE n-gram table, which cannot sit
# resident beside the other ~72 GiB on one 121.7 GiB GB10. VLLM_PLE_MMAP=1 serves the table
# from the checkpoint files through the evictable page cache (buffered reads, hot rows stay
# cached; approach from dime-online/qwen3.8-Flash-DGX-UltraFast v16b, Apache-2.0), and the KV
# pool is sized explicitly (6 GiB, ~350k tokens fp8: 2 x 128k or 5 x 64k sequences).
# B12X_COMPILE_WORKERS=1 keeps the first (cold) boot clear of earlyoom.
#
# v2 changes vs the r8 tp1-safe recipe, each screened on one image against a same-image control
# (2 passes ABBA over both Sparks, paired temperature-0 probes):
#   - VLLM_PLE_MMAP_WILLNEED_MAX=8192 (r8 tp1-ple-willneed, 2026-10-01): fadvise WILLNEED on every
#     row of a decode-sized PLE gather before reading it, so its page faults overlap instead of
#     running serially. fresh c1 step -16.9%, fresh c2-c8 -8..-9%, 16k c1-c4 -8..-11%.
#   - VLLM_MTP_DRAFT_VOCAB 131,072 ids (as in the TP=2 b1.4 recipe; r8 k17 tp1-dv128): step -2.7..-4.3%
#     at c1-c4, acceptance per position unchanged (Jev keep 0.69; the 16k c8 cell is dominated by
#     prefill stalls on the 6 GiB KV pool in every arm, control included).
#   Rejected at TP=1: d3 (3 drafts), mtpq (MXFP8 drafter: acceptance -3..-6 pts), mtpq-d3, wm MoE decode,
#   b12x SIMT GEMV for the drafter/router (step +2..+7% at c2-c8).
#
# Image: b1.4 vLLM (a7e649d8) + the TP=1 page-cache PLE reader (exp/r8-tp1-screen) +
# feat/r8-mtp-gemv (off), b12x exp/r8-tp1-wm 5bf24021 (off), warm layer docker/b0-warm with the
# TP=1 b12x plan seed. Numbers: README "Single Spark (experimental)".
#
# Run on one Spark: sparkrun run qwen3.8-flash-next-1x-dgx-spark --hosts <spark> --solo

recipe_version: "1"
name: qwen3.8-flash-next-1x-dgx-spark
description: "Experimental (v3e: v3d + retrained MTP drafter). Qwen3.8-Flash-Next on ONE DGX Spark (TP=1, NVFP4 GDN decode / MXFP8 prefill, PLE table through the page cache, NVMe keepalive, prefill read-ahead, 14 GiB KV pool), OpenAI-compatible API on port 8000 (2026-10-08)."

model: ursuciprian/Qwen3.8-Flash-Next-NVFP4-GDN-MSE
model_revision: 16c9bd54788d12390838a65ce4a4ecda97fa5f1d
container: ghcr.io/ursuciprian/spark-vllm-b12x:tp1-v3e-hf-20261008-21e0b201-5dad364d-warm
runtime: vllm

build_args: []

solo_only: true
min_nodes: 1
max_nodes: 1

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  num_speculative_tokens: 4
  # 14 GiB (v3c). With explicit KV bytes vLLM skips memory profiling; the utilization only gates
  # startup (free >= util x total), which the page cache would otherwise trip.
  kv_cache_memory_bytes: 15032385536
  gpu_memory_utilization: 0.01

env:
  VLLM_B12X_NVFP4_MXFP8_MIN_TOKENS: "41"
  VLLM_B12X_NVFP4_MXFP8_CHECKPOINT: "/cache/huggingface/hub/models--local-inference-lab--Qwen3.8-Flash-Next-NVFP4/snapshots/7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd"
  VLLM_GDN_SHARED_PREFILL_STAGING: "1"
  VLLM_GDN_COMPACT_RECORDS: "1"
  VLLM_PLE_MMAP: "1"
  VLLM_PLE_MMAP_WILLNEED_MAX: "8192"
  VLLM_PLE_MMAP_KEEPALIVE_MS: "50"
  VLLM_PLE_MMAP_PREFILL_WILLNEED: "1"
  VLLM_MTP_DRAFT_VOCAB: "/opt/mtp-vocab/ids-v2-K131072.txt.gz"
  VLLM_QWEN38_HC_MXFP8: "hc"
  VLLM_GDN_UNIFORM_DECODE_META_SKIP: "1"
  B12X_AUTOTUNE: "1"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_MXFP8_LM_HEAD: "1"
  B12X_COMPILE_WORKERS: "1"
  VLLM_GDN_DEFERRED_CHECKPOINTS: "1"
  VLLM_PREFIX_DROP_EXACT: "1"

command: |
  S=/opt/b12x-seed/preparation; D="$XDG_CACHE_HOME/b12x/compile/preparation"; if [ -d "$S" ] && [ -n "$XDG_CACHE_HOME" ]; then mkdir -p "$D" && for f in "$S"/*.json; do [ -e "$D/$(basename "$f")" ] || cp "$f" "$D/"; done; fi
  A=/opt/b12x-seed/torch_compile_cache; if [ -d "$A" ] && [ -n "$XDG_CACHE_HOME" ]; then mkdir -p "$XDG_CACHE_HOME/vllm/torch_compile_cache" && cp -rn "$A/." "$XDG_CACHE_HOME/vllm/torch_compile_cache/" || true; fi
  M=/cache/huggingface/hub/models--local-inference-lab--Qwen3.8-Flash-Next-NVFP4/snapshots/7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd; [ -s $M/model-00035-of-00036.safetensors ] && [ -s $M/model.safetensors.index.json ] || HF_HUB_OFFLINE=0 python3 -c "from huggingface_hub import snapshot_download as d; d('local-inference-lab/Qwen3.8-Flash-Next-NVFP4', revision='7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd', allow_patterns=['model-00035-of-00036.safetensors', 'model.safetensors.index.json'])" || exit 1
  vllm serve ursuciprian/Qwen3.8-Flash-Next-NVFP4-GDN-MSE \
    --revision 16c9bd54788d12390838a65ce4a4ecda97fa5f1d \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --served-model-name qwen3.8-flash-next ursuciprian/Qwen3.8-Flash-Next-NVFP4-GDN-MSE \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-parallel-prefills 4 \
    --prefill-policy decode-aware \
    --decode-refill-target auto \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic"}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --default-chat-template-kwargs '{{"reasoning_effort":"medium"}}' \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
    --gpu-memory-utilization {gpu_memory_utilization}
