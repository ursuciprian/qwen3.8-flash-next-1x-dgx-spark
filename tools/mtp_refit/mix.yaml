# Prompt mix for the MTP refit (#97, drafter-refit-design.md 4.3), weighted to agentic coding and tool calls.
# gen.py prompts: pulls each source with `datasets` at its pinned revision, converts it (adapter = converter in gen.py), drops
# prompts that share a 13-gram with anything under `exclude`, assigns `heldout_fraction` of each category to
# held-out by a hash of the prompt id, then samples categories to `share` of `total` prompts.
total: 3000             # prompts; gen.py run --budget-tokens stops at the response-token budget (2M in phase 2)
heldout_fraction: 0.05
seed: 97
max_prompt_tokens: 24000   # gen.py prompts drops prompts longer than ~3.5 chars per token of this
categories:
  agentic:        # multi-turn agent coding, tool calls in the qwen3_xml format through the server's template
    share: 0.40
    sources:
      - {dataset: nebius/SWE-agent-trajectories, revision: 68195a1450865274106246d0d0296a1d6807b88e, split: train, adapter: swe_agent}
  tools:          # single-turn tool calling with native tool definitions
    share: 0.20
    sources:
      - {dataset: Team-ACE/ToolACE, revision: 6bda777c88d21e5a204703c1ee45597a8fa4f734, split: train, adapter: toolace}
  code:
    share: 0.20
    sources:
      - {dataset: nvidia/OpenCodeReasoning, revision: 20a1ca19c0d050fe9057fc08339d6b370ec1c67a, config: split_0, split: split_0, adapter: field, field: input}
      # livecodebench/code_generation_lite is a loading-script dataset: datasets >= 4 cannot read it
  chat:
    share: 0.10
    sources:
      - {dataset: HuggingFaceH4/ultrachat_200k, revision: 8049631c405ae6576f93f445c6b8166f76f5505a, split: train_sft, adapter: field, field: prompt}
  math:
    share: 0.10
    sources:
      - {dataset: openai/gsm8k, revision: 740312add88f781978c0658806c59bc2815b9866, config: main, split: train, adapter: field, field: question}
      - {dataset: AI-MO/NuminaMath-CoT, revision: 9d8d210c9f6a36c8f3cd84045668c9b7800ef517, split: train, adapter: field, field: problem}
# Benchmark and gate prompts never trained on (paths or globs on dgx-01; files or directories: .py string literals,
# .json/.jsonl string values, any other file read whole as text). A pattern matching nothing is an error.
exclude:
  - ~/.local/share/uv/tools/tool-eval-bench/lib/python3*/site-packages/tool_eval_bench   # tool-eval-bench scenarios
  - ~/GEN-AI/qwen3.8-flash-next-dgx-spark-tp-2/scripts/hardmode_targeted.sh     # hardmode + TC-45 prompts
  - ~/GEN-AI/qwen3.8-flash-next-dgx-spark-tp-2/scripts/_gen_corpus.py           # Thunderdome / llama-benchy corpus
  - ~/GEN-AI/qwen3.8-flash-next-dgx-spark-tp-2/results/corpus-code.txt
  - ~/GEN-AI/qwen3.8-flash-next-dgx-spark-tp-2/results/corpus-prose.txt
  - ~/GEN-AI/hotel-ab/*.py                                                       # hotel-lights
  - ~/GEN-AI/hotel-ab/*.sh
  - ~/GEN-AI/k48/hotel.sh
  - ~/GEN-AI/llama-benchy/src
