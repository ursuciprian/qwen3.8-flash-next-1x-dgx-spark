
recipe_version: "1"
name: qwen3.8-flash-next-1x-dgx-spark-k74-mnbt16k
description: "Experimental (v3e: v3d + retrained MTP drafter). Qwen3.8-Flash-Next on ONE DGX Spark (TP=1, NVFP4 GDN decode / MXFP8 prefill, PLE table through the page cache, NVMe keepalive, prefill read-ahead, 14 GiB KV pool), OpenAI-compatible API on port 8000 (2026-10-08)."

model: ursuciprian/Qwen3.8-Flash-Next-NVFP4-GDN-MSE
model_revision: 16c9bd54788d12390838a65ce4a4ecda97fa5f1d
container: ghcr.io/ursuciprian/spark-vllm-b12x:tp1-v3e-hf-20261008-21e0b201-5dad364d-warm
runtime: vllm

build_args: []

solo_only: true
min_nodes: 1
max_nodes: 1

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  block_size: 16
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 16384
  num_speculative_tokens: 4
  # 14 GiB (v3c). With explicit KV bytes vLLM skips memory profiling; the utilization only gates
  # startup (free >= util x total), which the page cache would otherwise trip.
  kv_cache_memory_bytes: 15032385536
  gpu_memory_utilization: 0.01

env:
  XDG_CACHE_HOME: "/cache/runtime/k74-mnbt16k"
  VLLM_CACHE_ROOT: "/cache/runtime/k74-mnbt16k/vllm"
  VLLM_B12X_NVFP4_MXFP8_MIN_TOKENS: "41"
  VLLM_B12X_NVFP4_MXFP8_CHECKPOINT: "/cache/huggingface/hub/models--local-inference-lab--Qwen3.8-Flash-Next-NVFP4/snapshots/7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd"
  VLLM_GDN_SHARED_PREFILL_STAGING: "1"
  VLLM_GDN_COMPACT_RECORDS: "1"
  VLLM_PLE_MMAP: "1"
  VLLM_PLE_MMAP_WILLNEED_MAX: "8192"
  VLLM_PLE_MMAP_KEEPALIVE_MS: "50"
  VLLM_PLE_MMAP_PREFILL_WILLNEED: "1"
  VLLM_MTP_DRAFT_VOCAB: "/opt/mtp-vocab/ids-v2-K131072.txt.gz"
  VLLM_QWEN38_HC_MXFP8: "hc"
  VLLM_GDN_UNIFORM_DECODE_META_SKIP: "1"
  B12X_AUTOTUNE: "1"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_MEGA_AOT_ARTIFACT: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_POLICY_MODE: "auto"
  VLLM_MXFP8_LM_HEAD: "1"
  B12X_COMPILE_WORKERS: "1"
  VLLM_GDN_DEFERRED_CHECKPOINTS: "1"
  VLLM_PREFIX_DROP_EXACT: "1"

command: |
  S=/opt/b12x-seed/preparation; D="$XDG_CACHE_HOME/b12x/compile/preparation"; if [ -d "$S" ] && [ -n "$XDG_CACHE_HOME" ]; then mkdir -p "$D" && for f in "$S"/*.json; do [ -e "$D/$(basename "$f")" ] || cp "$f" "$D/"; done; fi
  A=/opt/b12x-seed/torch_compile_cache; if [ -d "$A" ] && [ -n "$XDG_CACHE_HOME" ]; then mkdir -p "$XDG_CACHE_HOME/vllm/torch_compile_cache" && cp -rn "$A/." "$XDG_CACHE_HOME/vllm/torch_compile_cache/" || true; fi
  M=/cache/huggingface/hub/models--local-inference-lab--Qwen3.8-Flash-Next-NVFP4/snapshots/7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd; [ -s $M/model-00035-of-00036.safetensors ] && [ -s $M/model.safetensors.index.json ] || HF_HUB_OFFLINE=0 python3 -c "from huggingface_hub import snapshot_download as d; d('local-inference-lab/Qwen3.8-Flash-Next-NVFP4', revision='7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd', allow_patterns=['model-00035-of-00036.safetensors', 'model.safetensors.index.json'])" || exit 1
  vllm serve ursuciprian/Qwen3.8-Flash-Next-NVFP4-GDN-MSE \
    --revision 16c9bd54788d12390838a65ce4a4ecda97fa5f1d \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --served-model-name qwen3.8-flash-next ursuciprian/Qwen3.8-Flash-Next-NVFP4-GDN-MSE \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-parallel-prefills 4 \
    --prefill-policy decode-aware \
    --decode-refill-target auto \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --block-size {block_size} \
    --load-format b12x \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic"}}' \
    --gdn-decode-kernel b12x \
    --linear-backend b12x \
    --moe-backend b12x \
    --no-enable-flashinfer-autotune \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --default-chat-template-kwargs '{{"reasoning_effort":"medium"}}' \
    --compilation-config '{{"pass_config":{{"fuse_act_quant":true}}}}' \
    --kv-cache-memory-bytes {kv_cache_memory_bytes} \
    --gpu-memory-utilization {gpu_memory_utilization}
