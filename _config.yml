title: Qwen3.8-Flash-Next on one DGX Spark
description: NVFP4 serving recipe for one NVIDIA DGX Spark (TP=1, MTP, b12x kernels), with measured throughput and a quality gate
theme: jekyll-theme-primer
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
include:
  - README.md
# results/ holds raw run data: pooled-run symlinks that point at paths on the Sparks break the Jekyll build.
# GitHub renders results/ from the repo tree instead.
exclude:
  - results
